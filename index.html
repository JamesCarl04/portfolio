<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James Alvarez - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      width: 100%; min-height: 100vh; overflow-x: hidden;
      background-color: #050508 !important;
      background-image: radial-gradient(circle at top right, rgba(121, 68, 154, 0.18), transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(41, 196, 255, 0.15), transparent 50%) !important;
      color: #ffffff !important;
    }
    canvas { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none; }
    .navbar {
      background: rgba(10, 12, 22, 0.82) !important;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
      padding: 15px 0; z-index: 1000;
    }
    .navbar-brand { font-size: 1.5rem; font-weight: 700; color: #ffffff !important; letter-spacing: 1.5px; }
    .nav-link { font-size: 1rem; font-weight: 500; color: rgba(255, 255, 255, 0.7) !important; transition: all 0.3s ease; }
    .nav-link:hover, .nav-link.active { color: #ffffff !important; }
    .nav-item { margin: 0 10px; }
    .hero-wrapper {
      position: relative; z-index: 5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 110px 20px 40px;
    }
    .glass-hero {
      background: rgba(12, 14, 24, 0.75);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: 16px; padding: 50px 45px;
      max-width: 850px; width: 100%;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
    }
    .hero-inner { display: flex; align-items: center; justify-content: center; gap: 45px; flex-wrap: wrap; }
    .hero-img img {
      width: 220px; height: 220px; object-fit: cover; border-radius: 50%;
      border: 4px solid rgba(167, 139, 250, 0.85);
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.35);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .hero-img img:hover { transform: scale(1.04); box-shadow: 0 0 35px rgba(167, 139, 250, 0.6); }
    .hero-content { text-align: left; max-width: 440px; }
    .role-badge {
      display: inline-block; font-size: 0.8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.2px; color: #c4b5fd;
      background: rgba(167, 139, 250, 0.15); border: 1px solid rgba(167, 139, 250, 0.35);
      padding: 5px 14px; border-radius: 20px; margin-bottom: 14px;
    }
    .hero-content h1 { font-size: 2.5rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
    .hero-content p { font-size: 1.05rem; color: rgba(255, 255, 255, 0.82); line-height: 1.6; margin-bottom: 26px; }
    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary-glass {
      text-decoration: none; background: #7c3aed; color: #ffffff !important;
      font-weight: 600; font-size: 0.95rem; padding: 11px 24px;
      border-radius: 10px; border: 1px solid #8b5cf6; transition: all 0.25s ease;
    }
    .btn-primary-glass:hover { background: #6d28d9; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45); }
    .btn-outline-glass {
      text-decoration: none; background: rgba(255, 255, 255, 0.06); color: #ffffff !important;
      font-weight: 600; font-size: 0.95rem; padding: 11px 24px;
      border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.4); transition: all 0.25s ease;
    }
    .btn-outline-glass:hover { background: rgba(255, 255, 255, 0.15); border-color: #ffffff; transform: translateY(-2px); }
    @media (max-width: 768px) {
      .glass-hero { padding: 35px 22px; }
      .hero-inner { flex-direction: column; gap: 24px; text-align: center; }
      .hero-img img { width: 180px; height: 180px; }
      .hero-content { text-align: center; }
      .hero-content h1 { font-size: 1.9rem; }
      .hero-actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">JCA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about-me.html">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="tech-stack.html">Tech Stack</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="hero-wrapper">
    <section class="glass-hero">
      <div class="hero-inner">
        <div class="hero-img">
          <img src="photos/james.jpg" alt="James Carl Alvarez">
        </div>
        <div class="hero-content">
          <span class="role-badge">BSIT 4A • Full-Stack & IoT Developer</span>
          <h1>James Carl Alvarez</h1>
          <p>Aspiring Software Developer building modern web, mobile, and connected IoT systems.</p>
          <div class="hero-actions">
            <a href="about-me.html" class="btn-primary-glass">Explore My Work</a>
            <a href="contact.html" class="btn-outline-glass">Connect With Me</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    let mouse = { x: null, y: null };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    class Particle {
      constructor() {
        this.x = Math.random() * width; this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.7; this.vy = (Math.random() - 0.5) * 0.7;
        this.r = Math.random() * 1.8 + 0.8;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
      }
    }
    function init() {
      resize(); particles = [];
      const count = window.innerWidth < 768 ? 45 : 85;
      for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update(); particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
          if (dist < 155) {
            ctx.beginPath(); ctx.strokeStyle = `rgba(255,255,255,${(1 - dist / 155) * 0.45})`;
            ctx.lineWidth = 0.8; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
          }
        }
        if (mouse.x !== null) {
          const dist = Math.hypot(particles[i].x - mouse.x, particles[i].y - mouse.y);
          if (dist < 180) {
            ctx.beginPath(); ctx.strokeStyle = `rgba(167,139,250,${(1 - dist / 180) * 0.65})`;
            ctx.lineWidth = 1; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    window.addEventListener('resize', init); init(); animate();
  </script>
</body>
</html>
