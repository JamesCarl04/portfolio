<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>James Alvarez - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=2" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #050508 !important;
      background-image: radial-gradient(circle at top right, rgba(121, 68, 154, 0.18), transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(41, 196, 255, 0.15), transparent 50%) !important;
      color: #ffffff !important;
    }

    canvas {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Sleek Dark Glass Navbar */
    .navbar {
      background: rgba(10, 12, 22, 0.78) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 15px 0;
      z-index: 1000;
    }

    .navbar-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff !important;
      letter-spacing: 1.5px;
    }

    .nav-link {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7) !important;
      transition: all 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff !important;
    }

    .nav-item {
      margin: 0 10px;
    }

    /* Main Layout & Glass Card */
    .main-wrapper {
      position: relative;
      z-index: 5;
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glass-card {
      width: 100%;
      background: rgba(12, 14, 24, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      padding: 55px 40px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .page-subtitle {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 40px;
    }

    /* Social Connect Cards */
    .contact-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .social-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 230px;
      text-decoration: none;
      background: rgba(24, 20, 44, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      color: #ffffff !important;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .social-card:hover {
      transform: translateY(-8px);
      border-color: #a78bfa;
      box-shadow: 0 10px 30px rgba(167, 139, 250, 0.35);
      color: #ffffff !important;
    }

    .social-card img {
      width: 75px !important;
      height: 75px !important;
      max-width: 75px !important;
      max-height: 75px !important;
      object-fit: contain;
      margin-bottom: 18px;
      transition: transform 0.3s ease;
    }

    .social-card:hover img {
      transform: scale(1.1);
    }

    .invert-icon {
      filter: invert(1) opacity(0.92);
    }

    .social-card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .social-card p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        padding: 100px 15px 40px;
      }
      .glass-card {
        padding: 35px 20px;
      }
      .page-title {
        font-size: 2rem;
      }
      .social-card {
        width: 100%;
        max-width: 260px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <canvas></canvas>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">JCA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about-me.html">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="tech-stack.html">Tech Stack</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    <div class="glass-card">
      <h1 class="page-title">Contact Me</h1>
      <p class="page-subtitle">Let's connect, collaborate, and build something awesome together!</p>
      
      <div class="contact-grid">
        
        <!-- LinkedIn Card -->
        <a href="https://www.linkedin.com/in/james-alvarez-a9bb90357/" target="_blank" rel="noopener noreferrer" class="social-card">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linkedin/linkedin-original.svg" width="75" height="75" alt="LinkedIn">
          <h3>LinkedIn</h3>
          <p>Connect professionally</p>
        </a>

        <!-- GitHub Card -->
        <a href="https://github.com/JamesCarl04/portfolio" target="_blank" rel="noopener noreferrer" class="social-card">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg" width="75" height="75" class="invert-icon" alt="GitHub">
          <h3>GitHub</h3>
          <p>Check out my code</p>
        </a>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
